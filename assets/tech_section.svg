<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320">
  <defs>
    <style>
      :root {
        --text-primary: #111111;
        --text-secondary: #555555;
        --text-muted: #888888;
        --accent: #c4a97d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-primary: #ededed;
          --text-secondary: #8c8c8c;
          --text-muted: #5c5c5c;
        }
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .section-title { font-size: 9.5px; font-weight: 500; letter-spacing: 3.5px; fill: var(--accent); }
      .category-title { font-size: 8.5px; font-weight: 500; letter-spacing: 2.5px; fill: var(--text-muted); }
      .tech-list { font-size: 13px; font-weight: 400; letter-spacing: 0.2px; fill: var(--text-primary); }
    </style>

    <linearGradient id="rl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="var(--accent)" stop-opacity="0"/>
      <stop offset="10%"  stop-color="var(--accent)" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="var(--accent)" stop-opacity="0.65"/>
      <stop offset="90%"  stop-color="var(--accent)" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vsep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="var(--accent)" stop-opacity="0"/>
      <stop offset="20%"  stop-color="var(--accent)" stop-opacity="0.22"/>
      <stop offset="80%"  stop-color="var(--accent)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <text x="46" y="36" class="section-title">TECHNOLOGY</text>

  <rect x="46" y="55" width="768" height="0.75" rx="0.4" fill="url(#rl)" />

  <line x1="430" y1="75" x2="430" y2="305" stroke="url(#vsep)" stroke-width="0.75" />

  <!-- LEFT COLUMN -->
  <text x="46" y="90" class="category-title">LANGUAGES</text>
  <text x="46" y="112" class="tech-list">Python · Java · JavaScript · TypeScript · SQL</text>

  <text x="46" y="144" class="category-title">FRONTEND</text>
  <text x="46" y="166" class="tech-list">React · Next.js · Tailwind CSS · Vite</text>

  <text x="46" y="198" class="category-title">BACKEND</text>
  <text x="46" y="220" class="tech-list">Flask · FastAPI · Node.js · Express</text>

  <text x="46" y="252" class="category-title">DATABASES &amp; DATA</text>
  <text x="46" y="274" class="tech-list">PostgreSQL · Supabase · MongoDB</text>
  <text x="46" y="296" class="tech-list">SQLite · SQLAlchemy</text>

  <!-- RIGHT COLUMN -->
  <text x="476" y="90" class="category-title">AI / ML</text>
  <text x="476" y="112" class="tech-list">Scikit-learn · Random Forest · SHAP · KMeans</text>
  <text x="476" y="134" class="tech-list">Isolation Forest · LLMs · RAG · AI Agents</text>
  <text x="476" y="156" class="tech-list">Prompt Engineering · Gemini</text>

  <text x="476" y="198" class="category-title">CLOUD / DEPLOYMENT</text>
  <text x="476" y="220" class="tech-list">AWS · AWS EC2 · Vercel · Render · Docker</text>

  <text x="476" y="252" class="category-title">TOOLS</text>
  <text x="476" y="274" class="tech-list">Git · GitHub · Postman · VS Code</text>
  <text x="476" y="296" class="tech-list">Cursor · Figma · Jupyter</text>

</svg>
