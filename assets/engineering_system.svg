<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260">
  <defs>
    <style>
      :root {
        --text-primary: #000000;
        --text-secondary: #333333; 
        --text-muted: #666666; 
        --accent: #c4a97d;
        --line-color: #cacaca; 
        --loop-color: #a8a8a8; 
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-primary: #ffffff; 
          --text-secondary: #d4d4d4; 
          --text-muted: #a0a0a0; 
          --line-color: #4a4a4a; 
          --loop-color: #6a6a6a; 
        }
      }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: var(--text-primary); text-anchor: middle; }
      .label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: var(--accent); text-anchor: middle; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: var(--text-secondary); text-anchor: middle; }
      .tiny-tech { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: var(--text-muted); text-anchor: middle; }
      .tiny-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 10px; font-weight: 600; fill: var(--text-muted); text-anchor: middle; letter-spacing: 1.5px; }
      
      .line { stroke: var(--line-color); stroke-width: 1.5; fill: none; }
      .loop-line { stroke: var(--loop-color); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <!-- TRACE SYSTEM -->
  <!-- Visible Main Line -->
  <path d="M 105 110 L 755 110" class="line" />

  <!-- Visible Feedback Loop -->
  <path d="M 755 110 L 755 195 Q 755 200 750 200 L 110 200 Q 105 200 105 195 L 105 110" class="loop-line" stroke-linejoin="round" />

  <!-- Directional Arrows -->
  <path d="M 168 106 L 173 110 L 168 114" class="line" stroke-linejoin="round" />
  <path d="M 298 106 L 303 110 L 298 114" class="line" stroke-linejoin="round" />
  <path d="M 428 106 L 433 110 L 428 114" class="line" stroke-linejoin="round" />
  <path d="M 558 106 L 563 110 L 558 114" class="line" stroke-linejoin="round" />
  <path d="M 688 106 L 693 110 L 688 114" class="line" stroke-linejoin="round" />

  <!-- Arrow for Feedback loop -->
  <path d="M 433 196 L 427 200 L 433 204" class="line" stroke-linejoin="round" stroke="var(--loop-color)" stroke-dasharray="none" />

  <!-- NODES -->
  <circle cx="105" cy="110" r="3.5" fill="var(--line-color)" />
  <circle cx="235" cy="110" r="3.5" fill="var(--line-color)" />
  <!-- Center focal node: BUILD -->
  <circle cx="365" cy="110" r="4.5" fill="var(--accent)" />
  <circle cx="495" cy="110" r="3.5" fill="var(--line-color)" />
  <circle cx="625" cy="110" r="3.5" fill="var(--line-color)" />
  <circle cx="755" cy="110" r="3.5" fill="var(--line-color)" />

  <!-- MAIN LABELS -->
  <text x="105" y="80" class="label">UNDERSTAND</text>
  <text x="235" y="80" class="label">DESIGN</text>
  <text x="365" y="80" class="label-accent">BUILD</text>
  <text x="495" y="80" class="label">VERIFY</text>
  <text x="625" y="80" class="label">SHIP</text>
  <text x="755" y="80" class="label">IMPROVE</text>

  <!-- DESCRIPTIVE PHRASES -->
  <text x="105" y="135" class="sublabel">what are we solving?</text>

  <text x="235" y="135" class="sublabel">choose the right</text>
  <text x="235" y="152" class="sublabel">approach</text>

  <text x="365" y="135" class="sublabel">make it work</text>
  <text x="365" y="152" class="tiny-tech">frontend · backend</text>
  <text x="365" y="167" class="tiny-tech">data · AI</text>

  <text x="495" y="135" class="sublabel">make sure it works</text>
  <text x="495" y="152" class="tiny-tech">tests · debug · review</text>

  <text x="625" y="135" class="sublabel">put it into</text>
  <text x="625" y="152" class="sublabel">production</text>
  <text x="625" y="169" class="tiny-tech">deploy · monitor</text>

  <text x="755" y="135" class="sublabel">learn · iterate</text>

  <!-- TINY TECHNICAL LABELS -->
  <text x="170" y="98" class="tiny-label">PROBLEM</text>
  <text x="300" y="98" class="tiny-label">SYSTEM</text>
  <text x="430" y="98" class="tiny-label">VALIDATION</text>
  <text x="560" y="98" class="tiny-label">RELEASE</text>
  <text x="430" y="190" class="tiny-label">FEEDBACK</text>

</svg>
