<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260">
  <defs>
    <style>
      :root {
        --text-primary: #000000;
        --text-secondary: #333333; 
        --text-muted: #666666; 
        --accent: #c4a97d;
        --line-color: #cacaca; 
        --loop-color: #a8a8a8; 
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-primary: #ffffff; 
          --text-secondary: #d4d4d4; 
          --text-muted: #a0a0a0; 
          --line-color: #4a4a4a; 
          --loop-color: #6a6a6a; 
        }
      }
      .label { font-family: 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 3.5px; fill: var(--text-primary); text-anchor: middle; }
      .label-accent { font-family: 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 3.5px; fill: var(--accent); text-anchor: middle; }
      .sublabel { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0px; fill: var(--text-secondary); text-anchor: middle; }
      .tiny-tech { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 7.5px; font-weight: 400; fill: var(--text-muted); text-anchor: middle; letter-spacing: 0.5px; }
      .tiny-label { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 8px; font-weight: 600; fill: var(--text-muted); text-anchor: middle; letter-spacing: 2.5px; }
      
      .line { stroke: var(--line-color); stroke-width: 1.25; fill: none; }
      .loop-line { stroke: var(--loop-color); stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- TRACE SYSTEM -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.2s" fill="freeze" />
    
    <!-- Invisible full path for animation to follow continuously -->
    <path id="traceFlow" d="M 105 110 L 755 110 L 755 185 Q 755 190 750 190 L 110 190 Q 105 190 105 185 Z" fill="none" />
    
    <!-- Visible Main Line -->
    <path d="M 105 110 L 755 110" class="line" />
    
    <!-- Visible Feedback Loop -->
    <path d="M 755 110 L 755 185 Q 755 190 750 190 L 110 190 Q 105 190 105 185 L 105 110" class="loop-line" stroke-linejoin="round" />
    
    <!-- Directional Arrows -->
    <path d="M 168 107 L 172 110 L 168 113" class="line" stroke-linejoin="round" />
    <path d="M 298 107 L 302 110 L 298 113" class="line" stroke-linejoin="round" />
    <path d="M 428 107 L 432 110 L 428 113" class="line" stroke-linejoin="round" />
    <path d="M 558 107 L 562 110 L 558 113" class="line" stroke-linejoin="round" />
    <path d="M 688 107 L 692 110 L 688 113" class="line" stroke-linejoin="round" />
    
    <path d="M 432 187 L 428 190 L 432 193" class="loop-line" stroke-linejoin="round" />
  </g>

  <!-- NODES -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.6s" fill="freeze" />
    <circle cx="105" cy="110" r="3" fill="var(--line-color)" />
    <circle cx="235" cy="110" r="3" fill="var(--line-color)" />
    <!-- Center focal node: BUILD -->
    <circle cx="365" cy="110" r="4" fill="var(--accent)" />
    <circle cx="495" cy="110" r="3" fill="var(--line-color)" />
    <circle cx="625" cy="110" r="3" fill="var(--line-color)" />
    <circle cx="755" cy="110" r="3" fill="var(--line-color)" />
  </g>

  <!-- MAIN LABELS -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.9s" fill="freeze" />
    <text x="105" y="86" class="label">UNDERSTAND</text>
    <text x="235" y="86" class="label">DESIGN</text>
    <text x="365" y="86" class="label-accent">BUILD</text>
    <text x="495" y="86" class="label">VERIFY</text>
    <text x="625" y="86" class="label">SHIP</text>
    <text x="755" y="86" class="label">IMPROVE</text>
  </g>

  <!-- DESCRIPTIVE PHRASES -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="1.2s" fill="freeze" />
    
    <text x="105" y="132" class="sublabel">what are we solving?</text>
    
    <text x="235" y="132" class="sublabel">choose the right</text>
    <text x="235" y="146" class="sublabel">approach</text>
    
    <text x="365" y="132" class="sublabel">make it work</text>
    <text x="365" y="148" class="tiny-tech">frontend · backend</text>
    <text x="365" y="160" class="tiny-tech">data · AI</text>
    
    <text x="495" y="132" class="sublabel">make sure it works</text>
    <text x="495" y="148" class="tiny-tech">tests · debug · review</text>
    
    <text x="625" y="132" class="sublabel">put it into</text>
    <text x="625" y="146" class="sublabel">production</text>
    <text x="625" y="162" class="tiny-tech">deploy · monitor</text>
    
    <text x="755" y="132" class="sublabel">learn · iterate</text>
  </g>

  <!-- TINY TECHNICAL LABELS -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="1.5s" fill="freeze" />
    <text x="170" y="100" class="tiny-label">PROBLEM</text>
    <text x="300" y="100" class="tiny-label">SYSTEM</text>
    <text x="430" y="100" class="tiny-label">VALIDATION</text>
    <text x="560" y="100" class="tiny-label">RELEASE</text>
    <text x="430" y="180" class="tiny-label">FEEDBACK</text>
  </g>

  <!-- SIGNAL ANIMATION -->
  <circle r="1.5" fill="var(--accent)" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0; 0.1; 0.9; 1" dur="12s" repeatCount="indefinite" />
    <animateMotion dur="12s" repeatCount="indefinite">
      <mpath href="#traceFlow" />
    </animateMotion>
  </circle>

</svg>
