<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450">
  <defs>
    <style>
      :root {
        --text-primary: #111111;
        --text-secondary: #444444;
        --text-muted: #777777;
        --accent: #c4a97d;
        --line-color: #e4e4e4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-primary: #f4f4f4;
          --text-secondary: #a3a3a3;
          --text-muted: #777777;
          --line-color: #333333;
        }
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .micro { font-size: 10px; font-weight: 600; letter-spacing: 3px; fill: var(--accent); }
      .headline { font-size: 20px; font-weight: 600; letter-spacing: 0.2px; fill: var(--text-primary); }
      .body { font-size: 15.5px; font-weight: 400; letter-spacing: 0.3px; fill: var(--text-secondary); line-height: 1.5; }
      .focus-line { font-size: 13px; font-weight: 500; letter-spacing: 0.5px; fill: var(--text-muted); }

      .col-header { font-size: 9px; font-weight: 600; letter-spacing: 1.5px; fill: var(--text-muted); }
      .col-title { font-size: 13.5px; font-weight: 600; letter-spacing: 0.2px; fill: var(--text-primary); }
      .col-body { font-size: 12.5px; font-weight: 400; letter-spacing: 0.2px; fill: var(--text-secondary); }

      .achievements { font-size: 12px; font-weight: 500; letter-spacing: 0.2px; fill: var(--text-muted); text-anchor: middle; }
    </style>

    <linearGradient id="rl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--line-color)" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="var(--line-color)" stop-opacity="1"/>
      <stop offset="100%" stop-color="var(--line-color)" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <text x="46" y="40" class="micro">ABOUT</text>

  <text x="46" y="80" class="headline">Software, data, and systems — built around real problems.</text>

  <text x="46" y="114" class="body">My work spans scientific data integration, financial software, and AI-powered</text>
  <text x="46" y="138" class="body">products. I focus on understanding the problem, connecting the right systems,</text>
  <text x="46" y="162" class="body">and making the solution work.</text>

  <text x="46" y="190" class="focus-line">Problem Solving · Systems Integration · End-to-End Delivery</text>

  <rect x="46" y="210" width="768" height="1" fill="url(#rl)" />

  <!-- COL 1 -->
  <text x="46" y="240" class="col-header">REAL-WORLD SYSTEMS</text>
  <text x="46" y="264" class="col-title">VARUNA</text>
  <text x="46" y="288" class="col-body">Integrating real ocean datasets</text>
  <text x="46" y="308" class="col-body">into backend data pipelines,</text>
  <text x="46" y="328" class="col-body">validating scientific values,</text>
  <text x="46" y="348" class="col-body">and connecting them to interactive</text>
  <text x="46" y="368" class="col-body">3D visualizations.</text>

  <!-- COL 2 -->
  <text x="315" y="240" class="col-header">FINANCE SOFTWARE</text>
  <text x="315" y="264" class="col-title">Nexus Finance</text>
  <text x="315" y="288" class="col-body">Connecting financial data storage,</text>
  <text x="315" y="308" class="col-body">backend services, machine-learning</text>
  <text x="315" y="328" class="col-body">analysis, and spending insights</text>
  <text x="315" y="348" class="col-body">in one full-stack application.</text>

  <!-- COL 3 -->
  <text x="584" y="240" class="col-header">PRODUCT OWNERSHIP</text>
  <text x="584" y="264" class="col-title">Bloom Studio / Bloom Talk</text>
  <text x="584" y="288" class="col-body">Developing conversational AI</text>
  <text x="584" y="308" class="col-body">workflows, chatbot memory, and</text>
  <text x="584" y="328" class="col-body">the underlying systems for an</text>
  <text x="584" y="348" class="col-body">AI-powered website builder.</text>

  <rect x="46" y="390" width="768" height="1" fill="url(#rl)" />

  <text x="430" y="426" class="achievements">SIH Internal Hackathon Winner — VidyaDhara  ·  State-Level Hackathon Winner — QuantEV  ·  Published Research</text>
</svg>
