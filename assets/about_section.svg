<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 178" width="860" height="178">
  <defs>
    <radialGradient id="abg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#181818"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </radialGradient>

    <!-- Warm-sand accent rule (matches hero) -->
    <linearGradient id="rl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#181818" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#c4a97d" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#c4a97d" stop-opacity="0.65"/>
      <stop offset="80%"  stop-color="#c4a97d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#181818" stop-opacity="0"/>
    </linearGradient>

    <!-- Vertical column separators -->
    <linearGradient id="vsep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c4a97d" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#c4a97d" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#c4a97d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c4a97d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="178" rx="10" fill="url(#abg)"/>

  <!-- ── ABOUT micro-label ── -->
  <text
    x="46" y="36"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="9.5"
    font-weight="500"
    letter-spacing="3.5"
    fill="#c4a97d"
    opacity="0"
  >ABOUT
    <animate attributeName="opacity" values="0;0.75" keyTimes="0;1" dur="1.4s" begin="0.1s" fill="freeze"/>
  </text>

  <!-- ── Core statement line 1 ── -->
  <text
    x="46" y="63"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5"
    font-weight="300"
    letter-spacing="0.3"
    fill="#e2e2e2"
    opacity="0"
  >I don't just build projects — I turn ideas into products.
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- ── Core statement line 2 ── -->
  <text
    x="46" y="86"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5"
    font-weight="300"
    letter-spacing="0.3"
    fill="#8c8c8c"
    opacity="0"
  >I work fast, take on ambitious problems, and don't stop until it ships.
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- ── Divider rule ── -->
  <rect x="46" y="102" width="768" height="0.75" rx="0.4" fill="url(#rl)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" fill="freeze"/>
  </rect>

  <!-- ─── 4-Column highlights ─── -->
  <!-- Column layout: centers at x=142, 334, 526, 718; separators at x=238, 430, 622 -->

  <!-- Col 1 — 2× Hackathon Winner -->
  <text x="142" y="127" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="8.5" font-weight="500" letter-spacing="2.5" fill="#5c5c5c" opacity="0">
    COMPETE
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1s" fill="freeze"/>
  </text>
  <text x="142" y="150" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="400" letter-spacing="0.2" fill="#d4d4d4" opacity="0">
    2× Hackathon Winner
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- Sep 1 -->
  <line x1="238" y1="112" x2="238" y2="160" stroke="url(#vsep)" stroke-width="0.75" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1s" fill="freeze"/>
  </line>

  <!-- Col 2 — Founder -->
  <text x="334" y="127" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="8.5" font-weight="500" letter-spacing="2.5" fill="#5c5c5c" opacity="0">
    BUILD
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.1s" fill="freeze"/>
  </text>
  <text x="334" y="150" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="400" letter-spacing="0.2" fill="#d4d4d4" opacity="0">
    Founder — Bloom Studio
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- Sep 2 -->
  <line x1="430" y1="112" x2="430" y2="160" stroke="url(#vsep)" stroke-width="0.75" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.1s" fill="freeze"/>
  </line>

  <!-- Col 3 — Research -->
  <text x="526" y="127" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="8.5" font-weight="500" letter-spacing="2.5" fill="#5c5c5c" opacity="0">
    PUBLISH
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.2s" fill="freeze"/>
  </text>
  <text x="526" y="150" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="400" letter-spacing="0.2" fill="#d4d4d4" opacity="0">
    Published Research
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- Sep 3 -->
  <line x1="622" y1="112" x2="622" y2="160" stroke="url(#vsep)" stroke-width="0.75" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.2s" fill="freeze"/>
  </line>

  <!-- Col 4 — Focus -->
  <text x="718" y="127" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="8.5" font-weight="500" letter-spacing="2.5" fill="#5c5c5c" opacity="0">
    SHIP
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.3s" fill="freeze"/>
  </text>
  <text x="718" y="150" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="400" letter-spacing="0.2" fill="#d4d4d4" opacity="0">
    AI / Software Engineering
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.4s" fill="freeze"/>
  </text>
</svg>
