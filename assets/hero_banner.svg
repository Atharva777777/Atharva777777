<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188">
  <defs>
    <style>
      :root {
        --text-primary: #111111;
        --text-secondary: #555555;
        --accent: #c4a97d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-primary: #ededed;
          --text-secondary: #8c8c8c;
        }
      }
    </style>

    <!-- Warm-sand accent gradient -->
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="var(--accent)" stop-opacity="0"/>
      <stop offset="15%"  stop-color="var(--accent)" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="var(--accent)" stop-opacity="0.95"/>
      <stop offset="85%"  stop-color="var(--accent)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- ── ATHARVA BORATE ── -->
  <text
    x="430" y="108"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="71"
    font-weight="200"
    letter-spacing="9"
    text-anchor="middle"
    fill="var(--text-primary)"
  >
    ATHARVA BORATE
  </text>

  <!-- ── Accent rule ── -->
  <rect x="294" y="125" width="272" height="0.9" rx="0.45" fill="url(#ruleGrad)" />

  <!-- ── PRODUCT ENGINEER ── -->
  <text
    x="430" y="148"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="5.5"
    text-anchor="middle"
    fill="var(--text-secondary)"
  >PRODUCT ENGINEER</text>

  <!-- ── SECONDARY DESCRIPTOR ── -->
  <text
    x="430" y="168"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="8.5"
    font-weight="400"
    letter-spacing="3.5"
    text-anchor="middle"
    fill="var(--text-secondary)"
  >SOFTWARE · AI · DATA · SYSTEMS</text>

</svg>
