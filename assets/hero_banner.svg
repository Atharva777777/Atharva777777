<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188">
  <defs>
    <style>
      :root {
        --text-primary: #111111;
        --text-secondary: #555555;
        --accent: #c4a97d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-primary: #ededed;
          --text-secondary: #8c8c8c;
        }
      }
    </style>

    <!-- Clip rect for the name wipe-reveal (left → right) -->
    <clipPath id="nameReveal">
      <rect x="0" y="0" width="0" height="188">
        <animate
          attributeName="width"
          values="0;860"
          dur="1.35s"
          begin="0.06s"
          fill="freeze"
          calcMode="spline"
          keySplines="0.77 0 0.18 1"/>
      </rect>
    </clipPath>

    <!-- Warm-sand accent gradient -->
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="var(--accent)" stop-opacity="0"/>
      <stop offset="15%"  stop-color="var(--accent)" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="var(--accent)" stop-opacity="0.95"/>
      <stop offset="85%"  stop-color="var(--accent)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- ── ATHARVA BORATE — clip wipe-reveal + subtle upward settle ── -->
  <g clip-path="url(#nameReveal)">
    <text
      x="430" y="108"
      font-family="'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif"
      font-size="71"
      font-weight="200"
      letter-spacing="9"
      text-anchor="middle"
      fill="var(--text-primary)"
    >
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,11; 0,0"
        dur="1.35s"
        begin="0.06s"
        fill="freeze"
        calcMode="spline"
        keySplines="0.77 0 0.18 1"/>
      ATHARVA BORATE
    </text>
  </g>

  <!-- ── Accent rule — draws from centre outward ── -->
  <rect x="430" y="125" width="0" height="0.9" rx="0.45" fill="url(#ruleGrad)" opacity="0">
    <animate attributeName="x"       values="430;294"  dur="0.88s" begin="1.28s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="width"   values="0;272"    dur="0.88s" begin="1.28s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0;1"      dur="0.22s" begin="1.28s" fill="freeze"/>
  </rect>

  <!-- ── PRODUCT ENGINEER — delayed fade-up ── -->
  <text
    x="430" y="148"
    font-family="'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="5.5"
    text-anchor="middle"
    fill="var(--text-secondary)"
    opacity="0"
  >PRODUCT ENGINEER
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.9s"
      begin="1.76s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.4 0 0.2 1"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,7; 0,0"
      dur="0.9s"
      begin="1.76s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- ── SECONDARY DESCRIPTOR — further delayed fade-up ── -->
  <text
    x="430" y="168"
    font-family="'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif"
    font-size="8.5"
    font-weight="400"
    letter-spacing="3.5"
    text-anchor="middle"
    fill="var(--text-secondary)"
    opacity="0"
  >SOFTWARE · AI · DATA · SYSTEMS
    <animate
      attributeName="opacity"
      values="0;1"
      dur="0.9s"
      begin="1.96s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.4 0 0.2 1"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,7; 0,0"
      dur="0.9s"
      begin="1.96s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.4 0 0.2 1"/>
  </text>

</svg>
