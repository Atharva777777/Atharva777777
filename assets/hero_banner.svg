<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="860" height="190">
  <defs>
    <!-- Subtle vignette: slightly lighter at center, darker at edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#181818"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </radialGradient>

    <!-- Single accent color: warm sand/parchment -->
    <!-- used only for the thin rule -->
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#111111" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#c4a97d" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#c4a97d" stop-opacity="0.9"/>
      <stop offset="75%"  stop-color="#c4a97d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="860" height="190" rx="10" fill="url(#vignette)"/>

  <!-- ── Name — fades in and rises slightly ── -->
  <text
    x="430" y="90"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="54"
    font-weight="300"
    letter-spacing="3"
    text-anchor="middle"
    fill="#f0f0f0"
  >
    <animate attributeName="opacity" values="0;0;1"   keyTimes="0;0.2;1"  dur="1.6s" fill="freeze" calcMode="spline" keySplines="0 0 0.2 1; 0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,12; 0,12; 0,0" keyTimes="0;0.2;1"
      dur="1.6s" fill="freeze" calcMode="spline" keySplines="0 0 0.2 1; 0.4 0 0.2 1"/>
    Atharva Borate
  </text>

  <!-- ── Accent rule — draws out from center ── -->
  <rect x="355" y="104" width="150" height="1" rx="0.5" fill="url(#ruleGrad)">
    <animate attributeName="x"     values="430;355"    dur="0.9s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="width" values="0;150"      dur="0.9s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0;1"      dur="0.3s" begin="0.9s" fill="freeze"/>
  </rect>

  <!-- ── Tagline — delayed fade-in ── -->
  <text
    x="430" y="138"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="12.5"
    font-weight="400"
    letter-spacing="5"
    text-anchor="middle"
    fill="#6b6b6b"
  >
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="2.2s" fill="freeze" calcMode="spline" keySplines="0 0 0.2 1; 0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,8; 0,8; 0,0" keyTimes="0;0.5;1"
      dur="2.2s" fill="freeze" calcMode="spline" keySplines="0 0 0.2 1; 0.4 0 0.2 1"/>
    AI  ·  SOFTWARE DEVELOPMENT  ·  PRODUCT DEVELOPMENT
  </text>

  <!-- ── Quiet attribution line — slowest fade ── -->
  <text
    x="430" y="168"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="300"
    letter-spacing="1.2"
    text-anchor="middle"
    fill="#3a3a3a"
    font-style="italic"
  >
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="3s" fill="freeze" calcMode="spline" keySplines="0 0 0.2 1; 0.4 0 0.2 1"/>
    Building technology that solves real-world problems and creates meaningful impact.
  </text>
</svg>
